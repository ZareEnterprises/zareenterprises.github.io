<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musician View — AMBRA Live Productions</title>
<link rel="icon" type="image/png" href="/assets/img/ambraweb.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/ambra-app.css?v={{ site.time | date: '%s' }}">
</head>
<body class="musician-portal">

<header class="top">
  <img class="top-logo" src="/assets/img/ambraSubmark.png" alt="AMBRA Submark">
  <p class="eyebrow" id="mv-eyebrow">AMBRA Live Productions</p>
  <h1 id="mv-event-name"></h1>
  <span class="mv-band-pill" id="mv-band-pill" style="display:none"></span>
  <p class="mv-welcome">Everything you need for the show, in one place — day &amp; time, rehearsals, your setlist, attire and transportation.</p>
</header>

<nav class="tabs" id="mv-tabs">
  <button class="tab-btn primary active" data-tab="daytime" type="button">Day of the Concert</button>
  <button class="tab-btn primary" data-tab="rehearsals" type="button">Rehearsals</button>
  <button class="tab-btn primary" data-tab="setlist" type="button">Setlist</button>
  <button class="tab-btn primary" data-tab="instrumentation" type="button">Instrumentation</button>
  <button class="tab-btn primary" data-tab="attire" type="button">Attire</button>
  <button class="tab-btn primary" data-tab="transportation" type="button">Transportation</button>
</nav>

<main class="musician-view">
  <div class="mv-status" id="mv-status" style="display:none"></div>

  <div class="mv-tab-panel" data-tab="daytime">
    <div class="mv-card">
      <div class="mv-daytime-row"><span class="mv-daytime-label">📍 Venue</span><span id="mv-venue">Henri A. Termeer Square</span></div>
      <div class="mv-daytime-row"><span class="mv-daytime-label">🗓️ Date</span><span id="mv-date">Sept 10, 2026</span></div>
      <div class="mv-daytime-row"><span class="mv-daytime-label">🕕 Show time</span><span id="mv-showtime">6:30pm – 10:30pm</span></div>
    </div>
  </div>

  <div class="mv-tab-panel" data-tab="rehearsals" style="display:none" id="mv-panel-rehearsals">
    <div class="mv-card mv-empty">Loading…</div>
  </div>

  <div class="mv-tab-panel" data-tab="setlist" style="display:none" id="mv-panel-setlist">
    <div class="mv-card mv-empty">Loading…</div>
  </div>

  <div class="mv-tab-panel" data-tab="instrumentation" style="display:none" id="mv-panel-instrumentation">
    <div class="mv-card mv-empty">Loading…</div>
  </div>

  <div class="mv-tab-panel" data-tab="attire" style="display:none" id="mv-panel-attire">
    <div class="mv-card mv-empty">Loading…</div>
  </div>

  <div class="mv-tab-panel" data-tab="transportation" style="display:none" id="mv-panel-transportation">
    <div class="mv-card mv-empty">Loading…</div>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://lnodvezexfsmeasfndys.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxub2R2ZXpleGZzbWVhc2ZuZHlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NDc5ODQsImV4cCI6MjEwMjUyMzk4NH0.8fF47-kQchYwyP4__atvO9VEO_huAKXRsIADbsdRHfE';
const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` };

// Same section order as the Band tab in the main /palante panel, so Attire
// lists musicians in the order everyone already knows from there.
const SECTIONS = ['Voices','Woods','Brasses','Strings','Rhythm Section','Percussion','Other','Stage Crew'];

function escapeHtml(str){ return (str+'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function formatDateNice(iso){
  if(!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

function formatSetTime(set){
  if(!set.set_time) return null;
  const [hh, mm] = set.set_time.split(':').map(Number);
  const period = hh >= 12 ? 'PM' : 'AM';
  const h12 = hh % 12 === 0 ? 12 : hh % 12;
  return `${h12}:${String(mm).padStart(2,'0')} ${period}`;
}

async function getJson(path){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers });
  return res.ok ? res.json() : [];
}

// ---------- Tabs ----------
document.querySelectorAll('#mv-tabs .tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#mv-tabs .tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.mv-tab-panel').forEach(p => {
      p.style.display = p.dataset.tab === btn.dataset.tab ? '' : 'none';
    });
  });
});

function renderRehearsals(rehearsals, rdSongs, songs){
  if(!rehearsals.length){
    return `<div class="mv-card mv-empty">🗓️ No rehearsals scheduled yet — check back later.</div>`;
  }
  return rehearsals.map((r, i) => {
    const assigned = rdSongs.filter(rs => rs.rehearsal_date_id === r.id).sort((a,b)=>(a.item_order||0)-(b.item_order||0));
    const chips = assigned.map(rs => {
      const song = songs.find(s => s.id === rs.song_id);
      return `<span class="mv-song-chip">${escapeHtml(song?.song_name || 'Untitled')}</span>`;
    }).join('');
    return `
    <div class="mv-card mv-rehearsal-card">
      <div class="mv-rehearsal-top">
        <span>Rehearsal ${i+1}${r.date_text ? ` · ${escapeHtml(r.date_text)}` : ''}</span>
        ${r.time_text ? `<span class="mv-rehearsal-time">${escapeHtml(r.time_text)}</span>` : ''}
      </div>
      ${r.location_text ? `<div class="mv-rehearsal-location">${r.location_link ? `<a href="${escapeHtml(r.location_link)}" target="_blank" rel="noopener">${escapeHtml(r.location_text)}</a>` : escapeHtml(r.location_text)}</div>` : ''}
      ${chips ? `<div class="mv-rehearsal-songs">${chips}</div>` : ''}
    </div>`;
  }).join('');
}

function renderSetlist(sets, songs, spotifyLink){
  const spotifyButton = spotifyLink
    ? `<a href="${escapeHtml(spotifyLink)}" target="_blank" rel="noopener" class="btn ghost small" style="display:inline-flex;margin-bottom:14px">🎧 Listen on Spotify</a>`
    : '';
  const taggedInUse = songs.some(s => s.band_name);
  const mySongs = taggedInUse ? songs.filter(s => s.band_name === window.__mvBandName) : songs;
  const orderedSets = [...sets].filter(s => s.set_type !== 'interlude').sort((a,b) => (a.set_order||0) - (b.set_order||0));

  const cards = orderedSets.map(set => {
    const setSongs = mySongs.filter(s => s.set_number === set.set_number).sort((a,b)=>(a.song_order||0)-(b.song_order||0));
    if(!setSongs.length) return '';
    const timeLabel = formatSetTime(set);
    const rows = setSongs.map(s => `
      <div class="mv-song-row">
        <div>
          <span class="mv-song-title">${escapeHtml(s.song_name || 'Untitled')}</span>
          ${s.artist ? `<span class="mv-song-artist"> — ${escapeHtml(s.artist)}</span>` : ''}
        </div>
        ${s.duration ? `<span class="mv-song-duration">${escapeHtml(s.duration)}</span>` : ''}
      </div>
    `).join('');
    return `
    <div class="mv-card mv-set-card">
      <div class="mv-set-top">
        <span class="mv-set-name">${escapeHtml(set.set_number)}</span>
        ${timeLabel ? `<span class="mv-set-time">${timeLabel}</span>` : ''}
      </div>
      ${rows}
    </div>`;
  }).filter(Boolean).join('');

  return spotifyButton + (cards || `<div class="mv-card mv-empty">🎶 No setlist for your band yet.</div>`);
}

function orderMembersByInstrument(members, catalog){
  const orderedCatalog = [...catalog].sort((a, b) => {
    const sa = SECTIONS.indexOf(a.section), sb = SECTIONS.indexOf(b.section);
    return (sa === -1 ? 99 : sa) - (sb === -1 ? 99 : sb) || a.name.localeCompare(b.name);
  });
  return orderedCatalog
    .map(cat => members.find(m => (m.instrument || '').toLowerCase() === cat.name.toLowerCase()))
    .filter(Boolean);
}

// ---------- Instrumentation ----------
// A dropdown of the band's musicians (name, with their instrument underneath)
// plus any guest named on a song. Picking one keeps the setlist visible and
// adds, to the right of each song, what that person plays in it.
const splitNames = str => (str || '').split('/').map(s => s.trim()).filter(Boolean);
const sameName = (a, b) => (a || '').trim().toLowerCase() === (b || '').trim().toLowerCase();
let instState = { people: [], songs: [], sets: [], songInstruments: [], selected: null, open: false };

function buildPeople(members, catalog, songs){
  const ordered = orderMembersByInstrument(members, catalog).filter(m => m.artist_name);
  const rest = members.filter(m => m.artist_name && !ordered.includes(m));
  const people = [...ordered, ...rest].map(m => ({ id: 'm:' + m.id, name: m.artist_name, instrument: m.instrument || '', guest: false }));
  const guests = [];
  songs.forEach(s => splitNames(s.guests).forEach(n => {
    if(!guests.some(g => sameName(g, n)) && !people.some(p => sameName(p.name, n))) guests.push(n);
  }));
  guests.forEach(n => people.push({ id: 'g:' + n, name: n, instrument: 'Special guest', guest: true }));
  return people;
}

// What this person does in one song: instrument, voice, BGV and/or guest spot.
function rolesInSong(person, song, songInstruments){
  const roles = [];
  const inst = person.instrument.toLowerCase();
  if(!person.guest && inst && songInstruments.some(si => si.song_id === song.id && (si.instrument || '').toLowerCase() === inst)) roles.push(person.instrument);
  if(splitNames(song.singers).some(n => sameName(n, person.name))) roles.push('Voice');
  if(splitNames(song.bgv).some(n => sameName(n, person.name))) roles.push('BGV');
  if(splitNames(song.guests).some(n => sameName(n, person.name))) roles.push('Special guest');
  return roles;
}

function renderInstrumentation(){
  const { people, songs, sets, songInstruments, selected, open } = instState;
  const active = people.find(p => p.id === selected);

  const optHtml = people.map(p => `
    <button type="button" class="mv-dd-opt${p.id === selected ? ' active' : ''}" role="option" data-person="${escapeHtml(p.id)}">
      <span class="mv-dd-name">${escapeHtml(p.name)}</span>
      <span class="mv-dd-inst">${escapeHtml(p.instrument || '—')}</span>
    </button>`).join('');
  const current = active
    ? `<span class="mv-dd-name">${escapeHtml(active.name)}</span><span class="mv-dd-inst">${escapeHtml(active.instrument || '—')}</span>`
    : `<span class="mv-dd-name mv-dd-placeholder">Select your name</span>`;

  const taggedInUse = songs.some(s => s.band_name);
  const mySongs = taggedInUse ? songs.filter(s => s.band_name === window.__mvBandName) : songs;
  const orderedSets = [...sets].filter(s => s.set_type !== 'interlude').sort((a,b) => (a.set_order||0) - (b.set_order||0));
  const list = orderedSets.map(set => {
    const setSongs = mySongs.filter(s => s.set_number === set.set_number).sort((a,b)=>(a.song_order||0)-(b.song_order||0));
    if(!setSongs.length) return '';
    const rows = setSongs.map(s => {
      let players = '';
      if(active){
        const roles = rolesInSong(active, s, songInstruments);
        players = `<div class="mv-song-players">${roles.length
          ? roles.map(r => `<span class="mv-player-chip">${escapeHtml(r)}</span>`).join('')
          : `<span class="mv-player-chip no">Doesn't play</span>`}</div>`;
      }
      return `
      <div class="mv-song-row">
        <span class="mv-song-title">${escapeHtml(s.song_name || 'Untitled')}</span>
        ${players}
      </div>`;
    }).join('');
    return `<div class="mv-card mv-set-card"><div class="mv-set-top"><span class="mv-set-name">${escapeHtml(set.set_number)}</span></div>${rows}</div>`;
  }).filter(Boolean).join('') || `<div class="mv-card mv-empty">🎶 No setlist for your band yet.</div>`;

  const panel = document.getElementById('mv-panel-instrumentation');
  panel.innerHTML = `
    <div class="mv-inst-picker">
      <p class="mv-inst-prompt">Choose your name to know where you play.</p>
      <div class="mv-dd${open ? ' open' : ''}">
        <button type="button" class="mv-dd-toggle" aria-haspopup="listbox" aria-expanded="${open}">${current}<span class="mv-dd-caret">▾</span></button>
        <div class="mv-dd-menu" role="listbox">${optHtml || '<div class="mv-inst-hint" style="padding:10px 14px">No musicians added yet.</div>'}</div>
      </div>
    </div>${list}`;
  panel.querySelector('.mv-dd-toggle').addEventListener('click', e => {
    e.stopPropagation();
    instState.open = !instState.open;
    renderInstrumentation();
  });
  panel.querySelectorAll('.mv-dd-opt').forEach(btn => btn.addEventListener('click', () => {
    instState.selected = btn.dataset.person;
    instState.open = false;
    renderInstrumentation();
  }));
}
document.addEventListener('click', e => {
  if(instState.open && !e.target.closest('.mv-dd')){ instState.open = false; renderInstrumentation(); }
});

function renderAttire(members, catalog){
  const withArtists = orderMembersByInstrument(members, catalog).filter(m => m.artist_name);
  if(!withArtists.length){
    return `<div class="mv-card mv-empty">👔 No outfit info yet.</div>`;
  }
  const rows = withArtists.map(m => {
    const colors = (m.outfit_color || '').split(',').map(c => c.trim()).filter(Boolean);
    const swatches = colors.map(c => `<span class="mv-swatch" style="background:${escapeHtml(c)}"></span>`).join('');
    return `
    <div class="mv-member-row">
      <span class="mv-member-instrument">${escapeHtml(m.instrument || '—')}</span>
      <span class="mv-member-name">${escapeHtml(m.artist_name)}</span>
      <span class="mv-member-swatches">${swatches}</span>
      <span class="mv-member-size">${escapeHtml(m.outfit_size || '')}</span>
    </div>`;
  }).join('');
  return `<div class="mv-card">${rows}</div>`;
}

function renderTransportGroup(rows, members, direction, title){
  const filtered = rows.filter(r => r.direction === direction);
  if(!filtered.length) return '';
  const list = filtered.map(r => {
    const passengerIds = (r.passenger_ids || '').split(',').map(s => s.trim()).filter(Boolean);
    const names = passengerIds.map(id => members.find(m => m.id === id)?.artist_name).filter(Boolean);
    return `
    <div class="mv-card">
      <div class="mv-rehearsal-top">
        <span>${escapeHtml(r.mode || 'Transportation')}${r.max_capacity ? ` · Max ${escapeHtml(r.max_capacity)}` : ''}</span>
        ${r.cost ? `<span class="mv-rehearsal-time">$${escapeHtml(r.cost)}</span>` : ''}
      </div>
      ${r.departure_point ? `<div class="mv-rehearsal-location">${escapeHtml(r.departure_point)}</div>` : ''}
      ${names.length ? `<div class="mv-rehearsal-songs">${names.map(n => `<span class="mv-song-chip">${escapeHtml(n)}</span>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
  return `<div class="mv-section-title">${title}</div>${list}`;
}

function renderTransportation(rows, members, bandInfo){
  const infoLines = [
    bandInfo.venue_arrival_time ? `<div class="mv-daytime-row"><span class="mv-daytime-label">On venue</span><span>${escapeHtml(bandInfo.venue_arrival_time)}</span></div>` : '',
    bandInfo.pickup_time ? `<div class="mv-daytime-row"><span class="mv-daytime-label">Pick up time</span><span>${escapeHtml(bandInfo.pickup_time)}</span></div>` : '',
    bandInfo.pickup_address ? `<div class="mv-daytime-row"><span class="mv-daytime-label">Address</span><span>${escapeHtml(bandInfo.pickup_address)}</span></div>` : ''
  ].filter(Boolean).join('');
  const infoCard = infoLines ? `<div class="mv-card">${infoLines}</div>` : '';

  const groups = renderTransportGroup(rows, members, 'to_event', 'To the Event') + renderTransportGroup(rows, members, 'back_home', 'Back to Home');

  if(!infoCard && !groups) return `<div class="mv-card mv-empty">🚐 No transportation set up yet.</div>`;
  return infoCard + groups;
}

async function boot(){
  const bandId = new URLSearchParams(location.search).get('b');
  const statusEl = document.getElementById('mv-status');
  function showStatus(icon, title, text){
    statusEl.innerHTML = `<div class="mv-state"><div class="mv-state-icon">${icon}</div><div class="mv-state-title">${escapeHtml(title)}</div><div class="mv-state-text">${escapeHtml(text)}</div></div>`;
    statusEl.style.display = 'block';
  }
  if(!bandId){
    showStatus('🎻', 'Link incomplete', "This link is missing its band — ask whoever runs your project for the correct link.");
    return;
  }

  const bands = await getJson(`bands?id=eq.${bandId}&select=*`);
  const bandInfo = bands[0];
  if(!bandInfo){
    showStatus('🎻', 'Link no longer valid', "This link isn't valid anymore — ask whoever runs your project for a new one.");
    return;
  }
  window.__mvBandName = bandInfo.name;
  const projectId = bandInfo.project_id;

  const [members, catalog, eventInfoRows, transportRows, rehearsals, rdSongs, songs, sets, spotifyRows, projectRows] = await Promise.all([
    getJson(`band?group_id=eq.${bandId}&select=*`),
    getJson(`instrument_catalog?group_id=eq.${bandId}&select=*`),
    getJson(`event_info?select=*&project_id=eq.${projectId}&limit=1`),
    getJson(`transportation_rows?group_id=eq.${bandId}&select=*&order=item_order.asc`),
    getJson(`rehearsal_dates?group_id=eq.${bandId}&select=*&order=item_order.asc`),
    getJson(`rehearsal_date_songs?select=*&order=item_order.asc`),
    getJson(`songs?select=*&project_id=eq.${projectId}&order=song_order.asc`),
    getJson(`sets?select=*&project_id=eq.${projectId}&order=set_order.asc`),
    getJson(`spotify_embed?select=*&project_id=eq.${projectId}&limit=1`),
    getJson(`projects?id=eq.${projectId}&select=name&limit=1`)
  ]);

  const pill = document.getElementById('mv-band-pill');
  pill.textContent = bandInfo.name;
  pill.style.display = 'inline-block';

  const eventInfo = eventInfoRows[0];
  const eventName = eventInfo?.event_name || projectRows[0]?.name || '';
  document.getElementById('mv-event-name').textContent = eventName;
  if(eventName) document.title = `${eventName} — AMBRA Live Productions`;
  if(eventInfo?.client) document.getElementById('mv-eyebrow').textContent = `AMBRA Live Productions · ${eventInfo.client}`;
  if(eventInfo?.venue) document.getElementById('mv-venue').textContent = eventInfo.venue;
  if(eventInfo?.event_date_iso) document.getElementById('mv-date').textContent = formatDateNice(eventInfo.event_date_iso);
  if(eventInfo?.show_time) document.getElementById('mv-showtime').textContent = eventInfo.show_time;

  document.getElementById('mv-panel-rehearsals').innerHTML = renderRehearsals(rehearsals, rdSongs, songs);
  document.getElementById('mv-panel-setlist').innerHTML = renderSetlist(sets, songs, spotifyRows[0]?.link);
  const songIds = songs.map(s => s.id);
  const songInstruments = songIds.length ? await getJson(`song_instruments?select=*&song_id=in.(${songIds.join(',')})`) : [];
  instState = { people: buildPeople(members, catalog, songs), songs, sets, songInstruments, selected: null, open: false };
  renderInstrumentation();
  document.getElementById('mv-panel-attire').innerHTML = renderAttire(members, catalog);
  document.getElementById('mv-panel-transportation').innerHTML = renderTransportation(transportRows, members, bandInfo);
}

boot();
</script>

</body>
</html>
