<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMBRA — Musicians</title>
<link rel="icon" type="image/png" href="/assets/img/ambraSubmark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --green:#121A15; --green-soft:#17211B; --card:#1C2721; --card-hover:#212E26; --line:#2C3A32;
    --gold:#D98A3D; --gold-bright:#EFAE66; --text:#F1ECE0; --text-muted:#AFA896; --text-faint:#7C8178;
    --shadow:0 18px 44px rgba(0,0,0,.38); --radius:18px;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; font-family:'Inter',sans-serif; color:var(--text); min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(217,138,61,0.14), transparent 60%),
      var(--green);
  }

  /* ---------- Hero ---------- */
  .hero{ padding:56px 24px 34px; text-align:center; position:relative; }
  .hero-mark{ width:40px; height:40px; margin:0 auto 18px; display:block; opacity:.92; }
  .hero-eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--gold); margin-bottom:14px; font-weight:500;
  }
  .hero-event{
    font-family:'Fraunces',serif; font-weight:700; font-size:clamp(28px,5vw,44px); line-height:1.12;
    margin:0; letter-spacing:-.01em;
  }
  .hero-sub{
    font-family:'Inter',sans-serif; font-size:14.5px; color:var(--text-muted); margin-top:12px;
    max-width:480px; margin-left:auto; margin-right:auto; line-height:1.6;
  }
  .hero-rule{
    width:64px; height:2px; margin:26px auto 0; border-radius:2px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  /* ---------- Grid & cards ---------- */
  .grid{
    max-width:1180px; margin:0 auto; padding:14px 24px 80px;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:26px;
  }
  .mcard{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    display:flex; flex-direction:column; transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    opacity:0; transform:translateY(14px); animation:cardIn .55s ease forwards;
  }
  .mcard:hover{ transform:translateY(-6px); box-shadow:var(--shadow); border-color:rgba(217,138,61,.45); background:var(--card-hover); }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }

  .mcard-photo-wrap{ position:relative; width:100%; aspect-ratio:1/1; background:var(--green-soft); overflow:hidden; }
  .mcard-photo{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s ease; }
  .mcard:hover .mcard-photo{ transform:scale(1.045); }
  .mcard-photo-wrap::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(185deg, transparent 55%, rgba(18,26,21,.55) 100%);
  }
  .mcard-photo-placeholder{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:600; font-size:38px; color:var(--gold);
    background:linear-gradient(160deg, var(--green-soft), var(--card));
  }

  .mcard-body{ padding:18px 18px 20px; display:flex; flex-direction:column; gap:11px; flex:1; }
  .mcard-name{ font-family:'Fraunces',serif; font-weight:700; font-size:19.5px; letter-spacing:-.01em; }
  .mcard-name span{ color:var(--gold); }
  .mcard-bio{ font-size:12.5px; color:var(--text-muted); line-height:1.58; flex:1; }

  .mcard-audio{
    display:flex; align-items:center; gap:9px; background:var(--green-soft); border:1px solid var(--line);
    border-radius:11px; padding:6px 10px 6px 12px;
  }
  .mcard-audio-label{ font-size:12.5px; flex-shrink:0; opacity:.85; }
  .mcard-audio audio{ width:100%; height:30px; accent-color:var(--gold); }

  .mcard-videos{ display:flex; flex-wrap:wrap; gap:7px; }
  .mcard-videos a{
    display:inline-flex; align-items:center; gap:5px;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.03em; color:var(--text);
    text-decoration:none; border:1px solid var(--line); background:var(--green-soft); border-radius:7px;
    padding:6px 10px; transition:.18s;
  }
  .mcard-videos a:hover{ border-color:var(--gold); color:var(--gold-bright); background:rgba(217,138,61,.1); }

  /* ---------- Skeleton loading ---------- */
  .mcard.skeleton{ animation:none; opacity:1; transform:none; }
  .skeleton-block{ background:linear-gradient(100deg, var(--green-soft) 35%, var(--line) 50%, var(--green-soft) 65%); background-size:200% 100%; animation:shimmer 1.6s infinite; }
  .skeleton .mcard-photo-wrap{ background:none; }
  .skeleton .mcard-photo-wrap, .skeleton .sk-line{ border-radius:0; }
  .sk-line{ height:11px; border-radius:6px; background:linear-gradient(100deg, var(--green-soft) 35%, var(--line) 50%, var(--green-soft) 65%); background-size:200% 100%; animation:shimmer 1.6s infinite; }
  @keyframes shimmer{ 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }

  /* ---------- State messages ---------- */
  .state-box{ max-width:420px; margin:70px auto; padding:0 24px; text-align:center; }
  .state-icon{ font-size:30px; margin-bottom:14px; opacity:.8; }
  .state-title{ font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin-bottom:8px; }
  .state-text{ font-size:13.5px; color:var(--text-muted); line-height:1.6; }

  /* ---------- Footer ---------- */
  .foot{
    text-align:center; padding:30px 24px 50px; border-top:1px solid var(--line);
    max-width:1180px; margin:10px auto 0;
  }
  .foot-brand{ font-family:'Fraunces',serif; font-weight:700; font-size:14px; color:var(--text-muted); }
  .foot-brand span{ color:var(--gold); }
  .foot-tag{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); margin-top:6px; }

  @media (max-width:600px){
    .hero{ padding:40px 20px 26px; }
    .grid{ padding:10px 16px 60px; gap:18px; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
    .mcard-body{ padding:14px 14px 16px; }
  }
</style>
</head>
<body>

<div class="hero">
  <img class="hero-mark" src="/assets/img/ambraSubmark.png" alt="">
  <div class="hero-eyebrow">AMBRA Live Productions</div>
  <h1 class="hero-event" id="event-name-label">Meet the Artists</h1>
  <p class="hero-sub">The musicians confirmed for this performance — their work, their sound, in their own words.</p>
  <div class="hero-rule"></div>
</div>

<div id="grid" class="grid"></div>

<div class="foot">
  <div class="foot-brand">AMBRA<span>.</span></div>
  <div class="foot-tag">Live Productions</div>
</div>

<script>
  const SUPABASE_URL = 'https://lnodvezexfsmeasfndys.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxub2R2ZXpleGZzbWVhc2ZuZHlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NDc5ODQsImV4cCI6MjEwMjUyMzk4NH0.8fF47-kQchYwyP4__atvO9VEO_huAKXRsIADbsdRHfE';
  const headers = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };

  function escapeHtml(str){ return (str+'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  function renderSkeleton(count){
    document.getElementById('grid').innerHTML = Array.from({ length: count }).map(() => `
      <div class="mcard skeleton">
        <div class="mcard-photo-wrap skeleton-block"></div>
        <div class="mcard-body">
          <div class="sk-line" style="width:60%; height:15px;"></div>
          <div class="sk-line" style="width:95%"></div>
          <div class="sk-line" style="width:80%"></div>
        </div>
      </div>`).join('');
  }

  function renderState(icon, title, text){
    document.getElementById('grid').innerHTML = '';
    document.getElementById('grid').insertAdjacentHTML('beforebegin', `
      <div class="state-box" id="state-box">
        <div class="state-icon">${icon}</div>
        <div class="state-title">${escapeHtml(title)}</div>
        <div class="state-text">${escapeHtml(text)}</div>
      </div>`);
  }

  async function boot(){
    renderSkeleton(6);
    const id = new URLSearchParams(location.search).get('id');
    if(!id){ renderState('🎻', 'Showcase not found', 'This link looks incomplete — check it and try again.'); return; }

    const showcaseRes = await fetch(`${SUPABASE_URL}/rest/v1/showcases?select=*&id=eq.${id}&limit=1`, { headers });
    const showcaseRows = showcaseRes.ok ? await showcaseRes.json() : [];
    const showcase = showcaseRows[0];
    if(!showcase){ renderState('🎻', 'Showcase not found', 'This link may have expired or been removed.'); return; }

    if(showcase.event_name) document.getElementById('event-name-label').textContent = showcase.event_name;

    const musiciansRes = await fetch(`${SUPABASE_URL}/functions/v1/airtable-directory?type=musicians`, { headers });
    if(!musiciansRes.ok){ renderState('⏳', 'Taking a little longer than usual', 'Could not load the musicians right now — try refreshing in a moment.'); return; }
    const { records } = await musiciansRes.json();
    const byId = Object.fromEntries((records || []).map(m => [m.id, m]));
    const musicians = (showcase.musician_ids || []).map(mid => byId[mid]).filter(Boolean);

    if(!musicians.length){ renderState('🎶', 'Lineup coming soon', 'No musicians have been listed for this show yet — check back shortly.'); return; }

    document.getElementById('grid').innerHTML = musicians.map((m, i) => `
      <div class="mcard" style="animation-delay:${Math.min(i*60,480)}ms">
        <div class="mcard-photo-wrap">
          ${m.photoUrl
            ? `<img class="mcard-photo" src="${escapeHtml(m.photoUrl)}" alt="${escapeHtml(m.firstName)}" loading="lazy">`
            : `<div class="mcard-photo-placeholder">${escapeHtml((m.firstName||'?')[0])}</div>`}
        </div>
        <div class="mcard-body">
          <div class="mcard-name">${escapeHtml(m.firstName)}<span>.</span></div>
          ${m.bio ? `<div class="mcard-bio">${escapeHtml(m.bio)}</div>` : ''}
          <div class="mcard-audio">
            <span class="mcard-audio-label">🎧</span>
            <audio controls preload="none" src="/assets/ambra/musician-audio/${encodeURIComponent(m.slug)}.mp3"
              onerror="this.closest('.mcard-audio').style.display='none'"></audio>
          </div>
          ${(m.youtubeLinks || []).length ? `<div class="mcard-videos">${m.youtubeLinks.map((u,i) => `<a href="${escapeHtml(u)}" target="_blank" rel="noopener">▶ Video ${i+1}</a>`).join('')}</div>` : ''}
        </div>
      </div>`).join('');
  }

  boot();
</script>

</body>
</html>
