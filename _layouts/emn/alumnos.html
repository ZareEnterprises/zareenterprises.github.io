<!DOCTYPE html>
<html lang="es" class="emn-landing">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMN — Alumnos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/assets/css/emn.css?v={{ site.time | date: '%s' }}">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="/assets/js/emn-auth.js"></script>
<style>
  body{ background:var(--gray-100); font-family:var(--font-body); color:var(--ink); margin:0; }
  .alumnos-wrap{ max-width:1000px; margin:0 auto; padding:32px 24px 60px; }
  .alumnos-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .alumnos-head h1{ font-family:var(--font-display); font-size:26px; margin:0; }
  .alumnos-head a.back{ font-size:13px; color:var(--gray-700); text-decoration:none; }
  .card{ background:var(--paper); border:1px solid var(--gray-300); border-radius:var(--radius); padding:20px 22px; margin-bottom:20px; }
  .card h2{ font-family:var(--font-display); font-size:16px; margin:0 0 14px; }
  #gate-msg{ text-align:center; padding:80px 20px; color:var(--gray-700); }
  #gate-msg a{ color:var(--red); }

  .invite-row{ display:grid; grid-template-columns:1.4fr 1.2fr 140px auto; gap:10px; align-items:end; }
  .invite-row .field label{ display:block; font-size:11px; font-weight:600; color:var(--gray-700); margin-bottom:5px; }
  .invite-row input, .invite-row select{ width:100%; padding:9px 10px; border:1px solid var(--gray-300); border-radius:7px; font-size:13px; font-family:inherit; }
  .invite-row button{ padding:10px 16px; border:none; border-radius:7px; background:var(--red); color:#fff; font-weight:600; font-size:13px; cursor:pointer; }
  .invite-row button:hover{ background:var(--red-dark); }
  .invite-msg{ font-size:12px; margin-top:8px; display:none; }
  .invite-msg.show{ display:block; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--gray-500); padding:8px 10px; border-bottom:1px solid var(--gray-300); }
  td{ padding:9px 10px; border-bottom:1px solid var(--gray-100); }
  tr.selectable{ cursor:pointer; }
  tr.selectable:hover{ background:var(--gray-100); }
  tr.selected{ background:var(--red-tint); }
  .role-pill{ font-size:11px; font-weight:600; padding:2px 9px; border-radius:999px; background:var(--gray-100); color:var(--gray-700); text-transform:capitalize; }
  .role-pill.admin{ background:var(--red-tint); color:var(--red); }
  select.role-select{ font-size:12.5px; padding:5px 7px; border:1px solid var(--gray-300); border-radius:6px; font-family:inherit; }
  .status-pill{ font-size:11px; color:var(--gray-500); }
  .status-pill.active{ color:#1E8E5A; }

  .chart-hint{ font-size:12.5px; color:var(--gray-500); margin:0 0 12px; }
</style>
</head>
<body>

<div class="alumnos-wrap">
  <div class="alumnos-head">
    <h1>Alumnos</h1>
    <a class="back" href="/practice-lab/">&larr; Volver a Practice Lab</a>
  </div>

  <div id="gate-msg" style="display:none"></div>

  <div id="alumnos-body" style="display:none">

    <div class="card" id="invite-card" style="display:none">
      <h2>Invitar a alguien</h2>
      <div class="invite-row">
        <div class="field"><label>Correo</label><input type="email" id="inv-email" placeholder="correo@ejemplo.com"></div>
        <div class="field"><label>Nombre (opcional)</label><input type="text" id="inv-name" placeholder="Nombre completo"></div>
        <div class="field"><label>Rol</label>
          <select id="inv-role">
            <option value="student">Student</option>
            <option value="professor">Professor</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button type="button" id="btn-invite">Invitar</button>
      </div>
      <p class="invite-msg" id="invite-msg"></p>
    </div>

    <div class="card">
      <h2>Personas</h2>
      <table>
        <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th></tr></thead>
        <tbody id="students-tbody"></tbody>
      </table>
    </div>

    <div class="card">
      <h2 id="chart-title">Tiempo de práctica</h2>
      <p class="chart-hint">Haz clic en un alumno de la tabla para ver sus últimos 14 días — minutos por día, por herramienta.</p>
      <canvas id="practiceChart" height="90"></canvas>
    </div>

  </div>
</div>

<script>
const TOOLS = [
  { key: 'sight-melody', label: 'Sight Melody', color: '#C8102E' },
  { key: 'interview-prep', label: 'Interview Prep', color: '#2E5FA3' }
];

let ALL_STUDENTS = [];
let selectedStudentId = null;
let practiceChart = null;

function last14Dates(){
  const out = [];
  const d = new Date();
  for(let i = 13; i >= 0; i--){
    const day = new Date(d);
    day.setDate(d.getDate() - i);
    out.push(day.getFullYear() + '-' + String(day.getMonth()+1).padStart(2,'0') + '-' + String(day.getDate()).padStart(2,'0'));
  }
  return out;
}

async function loadStudents(){
  const { data } = await emnSupabase.from('students').select('*').order('created_at', { ascending: true });
  ALL_STUDENTS = data || [];
}

function renderStudentsTable(){
  const isAdmin = emnStudentProfile.role === 'admin';
  document.getElementById('students-tbody').innerHTML = ALL_STUDENTS.map(s => `
    <tr class="selectable ${s.id === selectedStudentId ? 'selected' : ''}" data-id="${s.id}">
      <td>${s.full_name || '—'}</td>
      <td>${s.email}</td>
      <td>${isAdmin
        ? `<select class="role-select" data-role-for="${s.id}">
             <option value="student" ${s.role==='student'?'selected':''}>Student</option>
             <option value="professor" ${s.role==='professor'?'selected':''}>Professor</option>
             <option value="admin" ${s.role==='admin'?'selected':''}>Admin</option>
           </select>`
        : `<span class="role-pill ${s.role}">${s.role}</span>`}</td>
      <td><span class="status-pill ${s.status}">${s.status === 'active' ? 'Activo' : 'Pendiente'}</span></td>
    </tr>
  `).join('') || '<tr><td colspan="4" style="color:var(--gray-500)">Nadie invitado todavía.</td></tr>';

  document.querySelectorAll('#students-tbody tr.selectable').forEach(row => {
    row.addEventListener('click', (e) => {
      if(e.target.closest('select')) return;
      selectedStudentId = row.dataset.id;
      renderStudentsTable();
      renderChartFor(selectedStudentId);
    });
  });

  if(isAdmin){
    document.querySelectorAll('[data-role-for]').forEach(sel => {
      sel.addEventListener('click', (e) => e.stopPropagation());
      sel.addEventListener('change', async (e) => {
        const id = sel.dataset.roleFor;
        await emnSupabase.from('students').update({ role: e.target.value }).eq('id', id);
        const s = ALL_STUDENTS.find(x => x.id === id);
        if(s) s.role = e.target.value;
      });
    });
  }
}

async function renderChartFor(studentId){
  const student = ALL_STUDENTS.find(s => s.id === studentId);
  document.getElementById('chart-title').textContent = student ? `Tiempo de práctica — ${student.full_name || student.email}` : 'Tiempo de práctica';

  const dates = last14Dates();
  const { data: rows } = await emnSupabase
    .from('practice_activity')
    .select('*')
    .eq('student_id', studentId)
    .gte('activity_date', dates[0]);

  const datasets = TOOLS.map(t => ({
    label: t.label,
    backgroundColor: t.color,
    data: dates.map(d => {
      const row = (rows || []).find(r => r.tool === t.key && r.activity_date === d);
      return row ? Math.round((row.seconds / 60) * 10) / 10 : 0;
    })
  }));

  if(practiceChart) practiceChart.destroy();
  practiceChart = new Chart(document.getElementById('practiceChart'), {
    type: 'bar',
    data: { labels: dates.map(d => d.slice(5)), datasets },
    options: {
      responsive: true,
      scales: { x: { stacked: true }, y: { stacked: true, title: { display: true, text: 'Minutos' } } },
      plugins: { legend: { position: 'bottom' } }
    }
  });
}

document.getElementById('btn-invite').addEventListener('click', async () => {
  const email = document.getElementById('inv-email').value.trim();
  const full_name = document.getElementById('inv-name').value.trim();
  const role = document.getElementById('inv-role').value;
  const msg = document.getElementById('invite-msg');
  msg.classList.remove('show');

  if(!email){ msg.textContent = 'El correo es obligatorio.'; msg.style.color = 'var(--red)'; msg.classList.add('show'); return; }

  const btn = document.getElementById('btn-invite');
  btn.disabled = true; btn.textContent = 'Invitando…';

  try {
    const res = await fetch(`${EMN_SUPABASE_URL}/functions/v1/invite-student`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${emnSession.access_token}`,
        'apikey': EMN_SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ email, full_name: full_name || null, role })
    });
    const result = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(result.error || 'No se pudo invitar.');

    msg.textContent = 'Invitación enviada.';
    msg.style.color = '#1E8E5A';
    msg.classList.add('show');
    document.getElementById('inv-email').value = '';
    document.getElementById('inv-name').value = '';
    await loadStudents();
    renderStudentsTable();
  } catch(err){
    msg.textContent = err.message;
    msg.style.color = 'var(--red)';
    msg.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = 'Invitar';
  }
});

async function boot(){
  await emnInit();
  const gate = document.getElementById('gate-msg');

  if(!emnSession){
    gate.innerHTML = 'Esta página es solo para el equipo de EMN. <a href="/emn-login/">Inicia sesión</a> para continuar.';
    gate.style.display = 'block';
    return;
  }
  if(!emnStudentProfile || (emnStudentProfile.role !== 'admin' && emnStudentProfile.role !== 'professor')){
    gate.innerHTML = 'No tienes acceso a esta página.';
    gate.style.display = 'block';
    return;
  }

  document.getElementById('alumnos-body').style.display = 'block';
  if(emnStudentProfile.role === 'admin') document.getElementById('invite-card').style.display = 'block';

  await loadStudents();
  renderStudentsTable();
  if(ALL_STUDENTS.length){
    selectedStudentId = ALL_STUDENTS[0].id;
    renderStudentsTable();
    renderChartFor(selectedStudentId);
  }
}
boot();
</script>

</body>
</html>
