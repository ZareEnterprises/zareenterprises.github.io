<!DOCTYPE html>
<html lang="es" class="emn-landing">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Progress — EMN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/assets/css/emn.css?v={{ site.time | date: '%s' }}">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/emn-auth.js?v={{ site.time | date: '%s' }}"></script>
<style>
  body{ background:var(--gray-100); font-family:var(--font-body); color:var(--ink); margin:0; }
  .wrap{ max-width:1100px; margin:0 auto; padding:32px 24px 60px; }
  #gate-msg{ text-align:center; padding:100px 20px; color:var(--gray-700); }
  #gate-msg a{ color:var(--red); }

  header.top{ display:flex; flex-wrap:wrap; gap:14px 28px; align-items:flex-end; justify-content:space-between; margin-bottom:24px; }
  header.top h1{ font-family:var(--font-display); font-size:26px; margin:0; }
  .who{ display:flex; flex-direction:column; gap:4px; min-width:min(280px,100%); }
  .who label{ font-size:11px; font-weight:600; color:var(--gray-700); }
  .who input{ background:var(--paper); border:1px solid var(--gray-300); border-radius:8px; padding:9px 11px; font-size:14px; font-family:inherit; }
  .save-state{ font-size:11.5px; color:var(--gray-500); min-height:1.4em; }

  .board{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:28px; }
  .meter{ all:unset; box-sizing:border-box; cursor:pointer; background:var(--paper); border:1px solid var(--gray-300); border-radius:var(--radius); padding:12px 14px 14px; display:flex; flex-direction:column; gap:8px; min-height:100px; font-family:inherit; }
  .meter:hover{ border-color:var(--red); }
  .meter[aria-current="true"]{ border-color:var(--red); box-shadow:inset 0 0 0 1px var(--red); }
  .meter .name{ font-family:var(--font-display); font-weight:600; font-size:14.5px; }
  .meter .count{ font-size:12px; color:var(--gray-500); margin-top:auto; }
  .bars{ display:flex; gap:3px; height:7px; }
  .bars span{ flex:1; border-radius:2px; background:var(--gray-300); }
  .bars span.on{ background:var(--red); }
  .bars span.done{ background:#1E8E5A; }

  section.cat h2{ font-family:var(--font-display); font-size:20px; margin:0 0 4px; }
  .cat-intro{ font-size:13px; color:var(--gray-700); margin:0 0 16px; max-width:70ch; }
  .toolbar{ display:flex; flex-wrap:wrap; gap:10px; margin:0 0 12px; }
  .btn{ border:1px solid var(--gray-300); background:var(--paper); border-radius:8px; padding:9px 16px; cursor:pointer; font-weight:600; font-size:13px; font-family:inherit; }
  .btn:hover{ border-color:var(--red); color:var(--red); }
  .btn.primary{ background:var(--red); border-color:var(--red); color:#fff; }
  .btn.primary:hover{ background:var(--red-dark); color:#fff; }

  .table-scroll{ overflow-x:auto; background:var(--paper); border:1px solid var(--gray-300); border-radius:var(--radius); }
  table{ border-collapse:collapse; width:100%; min-width:900px; font-size:13.5px; }
  th{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--gray-500); text-align:left; padding:11px 10px 9px; border-bottom:1px solid var(--gray-300); white-space:nowrap; background:var(--paper); position:sticky; top:0; }
  td{ padding:6px 6px; border-bottom:1px solid var(--gray-100); vertical-align:top; }
  tr:last-child td{ border-bottom:0; }
  td input, td select, td textarea{ width:100%; background:transparent; border:1px solid transparent; border-radius:7px; padding:7px 8px; font-size:13.5px; font-family:inherit; color:var(--ink); }
  td input:hover, td select:hover, td textarea:hover{ border-color:var(--gray-300); }
  td input:focus, td select:focus, td textarea:focus{ border-color:var(--red); background:var(--gray-100); outline:none; }
  td select{ cursor:pointer; }
  td textarea{ resize:vertical; min-height:36px; line-height:1.4; }
  td.num{ width:32px; color:var(--gray-500); font-size:12px; padding-top:13px; text-align:right; }
  td.del{ width:36px; }
  .x{ border:0; background:none; cursor:pointer; color:var(--gray-500); font-size:18px; line-height:1; padding:6px 8px; border-radius:7px; }
  .x:hover{ color:var(--red); background:var(--gray-100); }
  .late-count{ display:block; color:var(--red); font-weight:700; }
  td input.late{ border-color:var(--red); color:var(--red); font-weight:700; }
  .empty{ padding:30px 20px; text-align:center; color:var(--gray-500); font-size:13.5px; }

  .track{ display:flex; flex-direction:column; gap:6px; padding:6px 4px; min-width:190px; }
  .steps{ display:flex; gap:4px; }
  .steps button{ flex:1; height:13px; min-width:20px; border:0; border-radius:3px; background:var(--gray-300); cursor:pointer; padding:0; }
  .steps button.on{ background:var(--red); }
  .steps.complete button{ background:#1E8E5A; }
  .steps button:hover{ outline:2px solid var(--red); outline-offset:1px; }
  .stage-name{ font-size:12px; font-weight:700; }
  .steps.complete + .stage-name{ color:#1E8E5A; }
  .stage-name.none{ color:var(--gray-500); font-weight:400; }

  .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:20px; background:var(--ink); color:#fff; padding:10px 12px 10px 18px; border-radius:999px; display:flex; gap:12px; align-items:center; font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:600; }
  .toast.show{ opacity:1; pointer-events:auto; }
  .toast button{ background:#fff; color:var(--ink); border:0; border-radius:999px; padding:6px 14px; font-weight:700; cursor:pointer; font-family:inherit; }
  @media (max-width:600px){ .board{ grid-template-columns:repeat(2,1fr); } .meter{ min-height:90px; } }
</style>
</head>
<body>

<header class="emn-header">
  <div class="emn-header__inner">
    <a href="https://zareenterprises.github.io/emn" class="emn-logo">
      <img src="/assets/img/emn-logo.png" alt="EMN logo">
    </a>
    <nav class="emn-nav">
      <a href="https://zareenterprises.github.io/emn" class="emn-nav__link">Home</a>
      <div class="emn-nav__item">
        <a href="https://zareenterprises.github.io/practice-lab" class="emn-nav__link">EMN Practice Lab</a>
        <button class="emn-nav__caret" aria-label="Abrir submenú de EMN Practice Lab" aria-expanded="false">&#9662;</button>
        <div class="emn-nav__dropdown">
          <a href="https://zareenterprises.github.io/sight-melody" class="emn-nav__dropdown-item">Sight reading &amp; Audio Practice</a>
          <a href="https://zareenterprises.github.io/interview-prep" class="emn-nav__dropdown-item">Berklee Interview Prep</a>
          <span class="emn-nav__dropdown-item is-disabled">Berklee Improvisation Practice <span class="soon">Pronto</span></span>
          <span class="emn-nav__dropdown-item is-disabled">Berklee Piece &amp; Impro <span class="soon">Pronto</span></span>
        </div>
      </div>
      <a href="https://zareenterprises.github.io/feedback" class="emn-nav__link">Obtén Feedback</a>
      <a href="https://www.instagram.com/emn.latam/" class="emn-nav__link emn-nav__link--external" target="_blank" rel="noopener">Nosotros</a>
    </nav>
  </div>
</header>

<div id="gate-msg" style="display:none"></div>

<div id="tracker-body" style="display:none">
<div class="wrap">
  <header class="top">
    <h1>Career Progress</h1>
    <div class="who">
      <label for="student">Nombre del alumno</label>
      <input id="student" type="text" placeholder="Escribe tu nombre" autocomplete="name">
      <div class="save-state" id="saveState" aria-live="polite"></div>
    </div>
  </header>

  <nav class="board" id="board" aria-label="Áreas"></nav>
  <section class="cat" id="cat"></section>
</div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="undo" type="button">Deshacer</button></div>
</div>

<script>
const CATS = [
  { id:'social', name:'Contenido Social Media', intro:'Planifica cada pieza de contenido: dónde se publica, en qué formato, con qué tono y para qué etapa del embudo.',
    fields:[
      {k:'idea',l:'Idea / título',t:'text',w:200},
      {k:'plataforma',l:'Plataforma',t:'select',o:['Instagram Reels','TikTok','YouTube','YouTube Shorts','LinkedIn','Facebook']},
      {k:'formato',l:'Formato',t:'select',o:['Behind-the-scenes','Testimonio de cliente','Clip de performance','Educativo','Tendencia / challenge','Anuncio de lanzamiento']},
      {k:'tono',l:'Tono / emoción',t:'select',o:['Energético','Moderado','Desinteresado','Emotivo','Humorístico','Inspirador']},
      {k:'embudo',l:'Etapa del embudo',t:'select',o:['Awareness (dar a conocer)','Consideración (mostrar valor)','Conversión (cerrar cliente)']},
      {k:'estado',l:'Progreso',t:'stage',o:['Idea','Guion','Grabado','Editado','Publicado']},
      {k:'fecha',l:'Fecha de publicación',t:'date'},
      {k:'link',l:'Link',t:'url',w:160},
      {k:'notas',l:'Notas',t:'textarea',w:220}]},
  { id:'canciones', name:'Canciones Publicadas', intro:'Cada canción, desde la primera idea hasta el lanzamiento.',
    fields:[
      {k:'nombre',l:'Nombre',t:'text',w:180},
      {k:'estilo',l:'Estilo musical',t:'text',list:['Pop','Rock','Urbano / Reggaetón','Balada','Indie','Jazz','R&B / Soul','Electrónica','Folk','Salsa','Cumbia','Flamenco','Cantautor'],w:150},
      {k:'progreso',l:'Progreso',t:'stage',o:['Idea','Maqueta','Grabación','Post producción','Publicado']},
      {k:'release',l:'Fecha de release',t:'date'},
      {k:'visuales',l:'Visuales (idea)',t:'textarea',w:200},
      {k:'distribuidora',l:'Distribuidora',t:'text',list:['DistroKid','CD Baby','TuneCore','Amuse','Ditto','ONErpm','AWAL','Sello discográfico'],w:150},
      {k:'portada',l:'Portada (idea)',t:'textarea',w:200},
      {k:'notas',l:'Notas',t:'textarea',w:220}]},
  { id:'tv', name:'TV', intro:'Programas y canales a los que quieres llegar, y en qué punto está cada contacto.',
    fields:[
      {k:'programa',l:'Programa / canal',t:'text',w:180},
      {k:'tipo',l:'Tipo de aparición',t:'select',o:['Entrevista','Actuación en vivo','Reportaje','Mención','Concurso televisado']},
      {k:'contacto',l:'Contacto',t:'text',w:170},
      {k:'estado',l:'Estado',t:'stage',o:['Por contactar','Contactado','En conversación','Confirmado','Emitido']},
      {k:'fecha',l:'Fecha de emisión',t:'date'},
      {k:'link',l:'Link',t:'url',w:160},
      {k:'notas',l:'Notas',t:'textarea',w:220}]},
  { id:'diarios', name:'Diarios', intro:'Prensa escrita y digital: medios, periodistas y publicaciones conseguidas.',
    fields:[
      {k:'medio',l:'Medio',t:'text',w:170},
      {k:'tipomedio',l:'Tipo de medio',t:'select',o:['Diario impreso','Diario digital','Revista','Blog','Fanzine']},
      {k:'formato',l:'Formato',t:'select',o:['Entrevista','Reseña','Nota de prensa','Mención','Artículo de opinión']},
      {k:'periodista',l:'Periodista / contacto',t:'text',w:170},
      {k:'estado',l:'Estado',t:'stage',o:['Por contactar','Nota enviada','En conversación','Confirmado','Publicado']},
      {k:'fecha',l:'Fecha de publicación',t:'date'},
      {k:'link',l:'Link',t:'url',w:160},
      {k:'notas',l:'Notas',t:'textarea',w:220}]},
  { id:'presskit', name:'PressKit', intro:'Las piezas que necesita tu press kit. Marca cada una a medida que la tengas lista.',
    seed:['Bio corta','Bio larga','Fotos profesionales','Logo','Música (links de streaming)','Videos en vivo','Prensa y citas destacadas','Rider técnico','Stage plot','Contacto y redes'].map(e=>({elemento:e})),
    fields:[
      {k:'elemento',l:'Elemento',t:'text',w:220},
      {k:'estado',l:'Estado',t:'stage',o:['Pendiente','En progreso','En revisión','Listo']},
      {k:'link',l:'Link / archivo',t:'url',w:200},
      {k:'notas',l:'Notas',t:'textarea',w:260}]},
  { id:'portfolio', name:'Portfolio/Website', intro:'Secciones de tu web o portfolio y su estado.',
    seed:['Home','Bio','Música','Videos','Conciertos / fechas','Galería de fotos','Press kit (EPK)','Contacto','Tienda / merch'].map(e=>({seccion:e})),
    fields:[
      {k:'seccion',l:'Sección',t:'text',w:200},
      {k:'plataforma',l:'Plataforma',t:'text',list:['Wix','Squarespace','WordPress','Linktree','Bandcamp','Carrd','Webflow'],w:150},
      {k:'estado',l:'Estado',t:'stage',o:['Pendiente','Contenido listo','Diseñado','Publicado']},
      {k:'url',l:'URL',t:'url',w:200},
      {k:'notas',l:'Notas',t:'textarea',w:240}]},
  { id:'concursos', name:'Concursos Musicales', intro:'Convocatorias que estás siguiendo, plazos y resultados.',
    fields:[
      {k:'nombre',l:'Concurso',t:'text',w:180},
      {k:'organizador',l:'Organizador',t:'text',w:160},
      {k:'categoria',l:'Categoría',t:'text',w:140},
      {k:'cancion',l:'Canción presentada',t:'text',w:160},
      {k:'limite',l:'Fecha límite',t:'date'},
      {k:'estado',l:'Estado',t:'stage',o:['Investigando','Preparando material','Inscrito','Resultado recibido']},
      {k:'resultado',l:'Resultado',t:'select',o:['No seleccionado','Seleccionado','Finalista','Mención','Ganador']},
      {k:'premio',l:'Premio',t:'text',w:140},
      {k:'notas',l:'Notas',t:'textarea',w:220}]},
  { id:'voluntariado', name:'Voluntariado', intro:'Actividades solidarias y comunitarias donde aportas tu música.',
    fields:[
      {k:'organizacion',l:'Organización / causa',t:'text',w:190},
      {k:'actividad',l:'Actividad',t:'select',o:['Concierto benéfico','Taller / clase','Evento comunitario','Mentoría','Hospital / residencia']},
      {k:'rol',l:'Tu rol',t:'text',w:150},
      {k:'fecha',l:'Fecha',t:'date'},
      {k:'horas',l:'Horas',t:'number',w:80},
      {k:'estado',l:'Estado',t:'stage',o:['Planificado','Confirmado','En curso','Completado']},
      {k:'contacto',l:'Contacto',t:'text',w:160},
      {k:'notas',l:'Notas',t:'textarea',w:220}]}
];

CATS.forEach(c=>{
  const i = c.fields.findIndex(f=>f.t==='stage');
  c.fields.splice(i+1,0,
    {k:'siguiente',l:'Siguiente paso',t:'textarea',w:200},
    {k:'objetivo',l:'Fecha objetivo',t:'date'});
});

const LS_KEY = 'emn-career-progress-v1';
let state = { student:'', current:'social', rows:{} };
let saveTimer = null, writing = Promise.resolve();
const uid = () => Math.random().toString(36).slice(2,10);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function ensureRows(){
  CATS.forEach(c=>{
    if(!Array.isArray(state.rows[c.id])){
      state.rows[c.id] = c.seed ? c.seed.map(s=>({id:uid(),...s})) : [];
    }
  });
}
const stageField = c => c.fields.find(f=>f.t==='stage');

/* ---------- saving (EMN Supabase, per student_id) ---------- */
function setSaveState(t){ $('#saveState').textContent = t; }
function scheduleSave(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  clearTimeout(saveTimer);
  if(!emnSession){ setSaveState('Guardado en este navegador'); return; }
  setSaveState('Guardando…');
  saveTimer = setTimeout(()=>{
    const snapshot = JSON.parse(JSON.stringify(state));
    writing = writing.then(() => emnSupabase.from('career_progress')
      .upsert({ student_id: emnSession.user.id, data: snapshot, updated_at: new Date().toISOString() }, { onConflict: 'student_id' }))
      .then(({error}) => { if(error) throw error; setSaveState('Guardado'); })
      .catch((e)=>{ console.error(e); setSaveState('Sin conexión: guardado en este navegador'); });
  }, 700);
}

/* ---------- rendering ---------- */
function renderBoard(){
  $('#board').innerHTML = CATS.map(c=>{
    const rows = state.rows[c.id], sf = stageField(c), n = sf.o.length;
    const done = rows.filter(r=>r[sf.k]===sf.o[n-1]).length;
    const total = rows.length;
    const segs = 10;
    const filled = total ? Math.round(done/total*segs) : 0;
    const bars = Array.from({length:segs},(_,i)=>`<span class="${i<filled ? (done===total?'done':'on') : ''}"></span>`).join('');
    const late = rows.filter(r=>isOverdue(c,r)).length;
    const count = total ? `${done} de ${total} · ${sf.o[n-1].toLowerCase()}` : 'Sin elementos';
    const lateTxt = late ? `<span class="late-count">${late} ${late===1?'fecha vencida':'fechas vencidas'}</span>` : '';
    return `<button class="meter" data-cat="${c.id}" aria-current="${state.current===c.id}"><span class="name">${esc(c.name)}</span><span class="bars" aria-hidden="true">${bars}</span><span class="count">${esc(count)}${lateTxt}</span></button>`;
  }).join('');
}

function cellHTML(f,row){
  const v = row[f.k] ?? '';
  const a = `data-k="${f.k}" aria-label="${esc(f.l)}"`;
  const mw = f.w ? ` style="min-width:${f.w}px"` : '';
  switch(f.t){
    case 'select': return `<select ${a} style="min-width:170px"><option value="">—</option>${f.o.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
    case 'textarea': return `<textarea ${a} rows="1"${mw}>${esc(v)}</textarea>`;
    case 'date': return `<input type="date" ${a} value="${esc(v)}" style="min-width:140px">`;
    case 'number': return `<input type="number" min="0" step="0.5" ${a} value="${esc(v)}"${mw}>`;
    case 'url': return `<input type="url" ${a} value="${esc(v)}" placeholder="https://"${mw}>`;
    case 'stage': return trackHTML(f,v);
    default: return `<input type="text" ${a} value="${esc(v)}"${f.list?` list="dl-${f.k}"`:''}${mw}>`;
  }
}
function trackHTML(f,v){
  const idx = f.o.indexOf(v), last = f.o.length-1;
  const btns = f.o.map((o,i)=>`<button type="button" class="${i<=idx?'on':''}" data-stage="${i}" aria-label="${esc(f.l)}: ${esc(o)}" aria-pressed="${i===idx}" title="${esc(o)}"></button>`).join('');
  return `<div class="track" data-k="${f.k}"><div class="steps${idx===last?' complete':''}">${btns}</div><span class="stage-name${idx<0?' none':''}">${idx<0?'Sin empezar':esc(v)}</span></div>`;
}

function renderCat(){
  const c = CATS.find(x=>x.id===state.current);
  const rows = state.rows[c.id];
  const lists = c.fields.filter(f=>f.list).map(f=>`<datalist id="dl-${f.k}">${f.list.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`).join('');
  const head = `<tr><th></th>${c.fields.map(f=>`<th>${esc(f.l)}</th>`).join('')}<th><span class="sr" style="position:absolute;left:-9999px">Eliminar</span></th></tr>`;
  const body = rows.length
    ? rows.map((r,i)=>`<tr data-id="${r.id}"><td class="num">${i+1}</td>${c.fields.map(f=>`<td>${cellHTML(f,r)}</td>`).join('')}<td class="del"><button class="x" data-del aria-label="Eliminar fila ${i+1}" title="Eliminar fila">×</button></td></tr>`).join('')
    : `<tr><td colspan="${c.fields.length+2}" class="empty">Todavía no hay nada aquí. Añade tu primera fila para empezar.</td></tr>`;
  $('#cat').innerHTML = `
    <h2>${esc(c.name)}</h2>
    <p class="cat-intro">${esc(c.intro)}</p>
    <div class="toolbar">
      <button class="btn primary" id="add" type="button">Añadir fila</button>
      <button class="btn" id="csv" type="button">Descargar CSV</button>
    </div>
    ${lists}
    <div class="table-scroll"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  document.querySelectorAll('#cat textarea').forEach(autoGrow);
  markOverdue();
}
const today = () => new Date().toISOString().slice(0,10);
function isOverdue(c,r){
  const sf = stageField(c);
  return r.objetivo && r.objetivo < today() && r[sf.k] !== sf.o[sf.o.length-1];
}
function markOverdue(){
  const c = CATS.find(x=>x.id===state.current);
  document.querySelectorAll('#cat tbody tr[data-id]').forEach(tr=>{
    const r = curRows().find(x=>x.id===tr.dataset.id), inp = tr.querySelector('[data-k="objetivo"]');
    if(!r || !inp) return;
    const late = isOverdue(c,r);
    inp.classList.toggle('late', late);
    inp.title = late ? 'Fecha objetivo vencida' : '';
  });
}
function render(){ renderBoard(); renderCat(); }
function autoGrow(t){ t.style.height='auto'; t.style.height = t.scrollHeight+2+'px'; }

/* ---------- interactions ---------- */
const curRows = () => state.rows[state.current];
const rowOf = el => curRows().find(r=>r.id===el.closest('tr')?.dataset.id);

$('#board').addEventListener('click', e=>{
  const b = e.target.closest('.meter'); if(!b) return;
  state.current = b.dataset.cat; render(); scheduleSave();
  $('#cat').scrollIntoView({block:'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
});
$('#cat').addEventListener('input', e=>{
  const el = e.target, row = rowOf(el); if(!row || !el.dataset.k) return;
  row[el.dataset.k] = el.value;
  if(el.tagName==='TEXTAREA') autoGrow(el);
  if(el.dataset.k==='objetivo'){ markOverdue(); renderBoard(); }
  scheduleSave();
});
$('#cat').addEventListener('change', e=>{ if(e.target.tagName==='SELECT') renderBoard(); });
$('#cat').addEventListener('click', e=>{
  if(e.target.id==='add'){
    curRows().push({id:uid()}); renderCat(); renderBoard(); scheduleSave();
    const trs = document.querySelectorAll('#cat tbody tr'); trs[trs.length-1]?.querySelector('input,select,textarea')?.focus();
    return;
  }
  if(e.target.id==='csv'){ exportCSV(); return; }
  const stepBtn = e.target.closest('[data-stage]');
  if(stepBtn){
    const track = stepBtn.closest('.track'), row = rowOf(track);
    const c = CATS.find(x=>x.id===state.current), f = c.fields.find(x=>x.k===track.dataset.k);
    const i = +stepBtn.dataset.stage;
    row[f.k] = (row[f.k]===f.o[i] && i===0) ? '' : f.o[i]; // click first step again to reset
    track.outerHTML = trackHTML(f,row[f.k]);
    markOverdue(); renderBoard(); scheduleSave();
    return;
  }
  if(e.target.closest('[data-del]')){
    const rows = curRows(), row = rowOf(e.target), idx = rows.indexOf(row);
    rows.splice(idx,1); lastDeleted = {cat:state.current, row, idx};
    renderCat(); renderBoard(); scheduleSave(); showToast('Fila eliminada');
  }
});
$('#student').addEventListener('input', e=>{ state.student = e.target.value; scheduleSave(); });

let lastDeleted = null, toastTimer = null;
function showToast(msg){
  $('#toastMsg').textContent = msg; $('#toast').classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>$('#toast').classList.remove('show'), 6000);
}
$('#undo').addEventListener('click', ()=>{
  if(!lastDeleted) return;
  state.rows[lastDeleted.cat].splice(lastDeleted.idx,0,lastDeleted.row);
  state.current = lastDeleted.cat; lastDeleted = null;
  $('#toast').classList.remove('show'); render(); scheduleSave();
});

/* ---------- CSV ---------- */
function exportCSV(){
  const c = CATS.find(x=>x.id===state.current);
  const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const lines = [c.fields.map(f=>q(f.l)).join(',')].concat(state.rows[c.id].map(r=>c.fields.map(f=>q(r[f.k])).join(',')));
  const name = (state.student ? state.student.trim().replace(/\s+/g,'-')+'-' : '') + c.name.replace(/[^\wÀ-ÿ]+/g,'-') + '.csv';
  const data = '﻿'+lines.join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

/* ---------- boot ---------- */
async function emnBootTracker(){
  const gate = document.getElementById('gate-msg');
  if(!emnSession){
    gate.innerHTML = 'Inicia sesión para llevar tu Career Progress. <a href="/emn-login">Inicia sesión</a> para continuar.';
    gate.style.display = 'block';
    return;
  }

  try{ const saved = JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(saved && saved.rows) state = {...state, ...saved}; }catch(e){}
  ensureRows();
  if(!state.student && emnStudentProfile?.full_name) state.student = emnStudentProfile.full_name;
  $('#student').value = state.student || '';
  render();
  setSaveState('Guardado en este navegador');
  document.getElementById('tracker-body').style.display = 'block';

  try{
    const { data, error } = await emnSupabase.from('career_progress').select('data').eq('student_id', emnSession.user.id).maybeSingle();
    if(error) throw error;
    if(data && data.data && data.data.rows){
      state = {...state, ...data.data};
      ensureRows();
      $('#student').value = state.student || '';
      render();
    }
    setSaveState('Guardado');
  }catch(e){ console.error(e); }
}
</script>

<script>
  emnInit().then(emnBootTracker);
</script>
