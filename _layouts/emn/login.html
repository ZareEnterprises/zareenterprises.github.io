<!DOCTYPE html>
<html lang="es" class="emn-landing">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMN — Ingreso de alumnos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/assets/css/emn.css?v={{ site.time | date: '%s' }}">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{ background:var(--gray-100); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; font-family:var(--font-body); }
  .auth-card{ background:var(--paper); border:1px solid var(--gray-300); border-radius:var(--radius); padding:36px 32px; width:100%; max-width:380px; box-shadow:0 20px 50px rgba(0,0,0,.06); }
  .auth-card img{ height:36px; margin-bottom:18px; }
  .auth-card .eyebrow{ font-family:var(--font-body); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--gray-500); margin:0 0 6px; }
  .auth-card h1{ font-family:var(--font-display); font-size:24px; font-weight:600; color:var(--ink); margin:0 0 22px; line-height:1.25; }
  .auth-card h1 span{ color:var(--red); }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; font-weight:600; color:var(--gray-700); margin-bottom:5px; }
  .field input{ width:100%; padding:11px 12px; border:1px solid var(--gray-300); border-radius:8px; font-size:14px; font-family:inherit; color:var(--ink); }
  .field input:focus{ outline:none; border-color:var(--red); }
  .btn-primary{ width:100%; padding:12px; border:none; border-radius:8px; background:var(--red); color:#fff; font-weight:600; font-size:14px; cursor:pointer; transition:.15s; }
  .btn-primary:hover{ background:var(--red-dark); }
  .btn-primary:disabled{ opacity:.6; cursor:default; }
  .error-msg{ display:none; color:var(--red); font-size:12.5px; margin:-4px 0 14px; }
  .error-msg.show{ display:block; }
  .footnote{ text-align:center; font-size:11.5px; color:var(--gray-500); margin:20px 0 0; }
</style>
</head>
<body>

  <div class="auth-card">
    <img src="/assets/img/emn-logo.png" alt="EMN logo">
    <p class="eyebrow" id="eyebrow">Acceso de alumnos</p>
    <h1 id="heading">Escuela de Música<br>y <span>Negocios</span></h1>

    <form id="login-form">
      <div class="field">
        <label for="email">Correo</label>
        <input type="email" id="email" placeholder="tucorreo@ejemplo.com" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <p class="error-msg" id="error-msg">Ese correo y contraseña no coinciden.</p>

      <button type="submit" class="btn-primary" id="submit-btn">Ingresar</button>
    </form>

    <!-- Shown instead of the form above when arriving from an invite email
         (hands off a one-time session and expects a password to be set
         before it can be used again). There's no self-signup form anywhere
         on this page — the only way in is being invited by an Admin. -->
    <form id="set-password-form" style="display:none">
      <div class="field">
        <label for="new-password">Nueva contraseña</label>
        <input type="password" id="new-password" placeholder="••••••••" autocomplete="new-password" minlength="6" required>
      </div>
      <div class="field">
        <label for="confirm-password">Confirma tu contraseña</label>
        <input type="password" id="confirm-password" placeholder="••••••••" autocomplete="new-password" minlength="6" required>
      </div>

      <p class="error-msg" id="set-password-error"></p>

      <button type="submit" class="btn-primary" id="set-password-btn">Guardar y continuar</button>
    </form>

    <p class="footnote">© Escuela de Música y Negocios</p>
  </div>

  <script>
    // Same EMN Supabase project as /assets/js/emn-auth.js — kept inline
    // here too since this page needs to run before that file's helpers
    // exist yet (it handles its own sign-in instead of using emnInit()).
    const SUPABASE_URL = 'https://gpoddvcrsdkpgfmyniqu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdwb2RkdmNyc2RrcGdmbXluaXF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0Nzc3MzksImV4cCI6MjEwNTA1MzczOX0.N9XvN4xdln5GFlTcpv3nE3iThH7Jfoym23HPp97_fxc';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');

    // Invite emails land here with #type=invite in the URL — read that
    // BEFORE supabase-js's automatic session detection rewrites the URL.
    const hashParams = new URLSearchParams(window.location.hash.slice(1));
    const isSettingPassword = hashParams.get('type') === 'invite' || hashParams.get('type') === 'recovery';

    if(isSettingPassword){
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('set-password-form').style.display = '';
      document.getElementById('eyebrow').textContent = 'Último paso';
      document.getElementById('heading').innerHTML = 'Elige tu<br><span>contraseña</span>';
    } else {
      // Sign-in is optional across EMN — but if there's already a session,
      // no reason to show the form again.
      supabaseClient.auth.getSession().then(({ data }) => {
        if(data.session) window.location.href = '/practice-lab';
      });
    }

    document.getElementById('set-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('set-password-error');
      const btn = document.getElementById('set-password-btn');
      errEl.classList.remove('show');

      const pw1 = document.getElementById('new-password').value;
      const pw2 = document.getElementById('confirm-password').value;
      if(pw1 !== pw2){
        errEl.textContent = 'Las contraseñas no coinciden.';
        errEl.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Guardando…';

      const { data: { session } } = await supabaseClient.auth.getSession();
      if(!session){
        errEl.textContent = 'Este link ya expiró. Pide que te envíen una nueva invitación.';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Guardar y continuar';
        return;
      }

      const { error: pwError } = await supabaseClient.auth.updateUser({ password: pw1 });
      if(pwError){
        errEl.textContent = pwError.message;
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Guardar y continuar';
        return;
      }

      await supabaseClient.from('students').update({ status: 'active' }).eq('id', session.user.id);
      window.location.href = '/practice-lab';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Ingresando…';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if(error){
        errorMsg.textContent = error.message === 'Invalid login credentials'
          ? 'Ese correo y contraseña no coinciden.'
          : error.message;
        errorMsg.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Ingresar';
        return;
      }

      window.location.href = '/practice-lab';
    });
  </script>

</body>
</html>
