<!DOCTYPE html>
<html lang="es" class="emn-landing">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMN — Usuarios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/assets/css/emn.css?v={{ site.time | date: '%s' }}">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/emn-auth.js?v={{ site.time | date: '%s' }}"></script>
<style>
  body{ background:var(--gray-100); font-family:var(--font-body); color:var(--ink); margin:0; }
  .usuarios-wrap{ max-width:900px; margin:0 auto; padding:32px 24px 60px; }
  .usuarios-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .usuarios-head h1{ font-family:var(--font-display); font-size:26px; margin:0; }
  .usuarios-head a.back{ font-size:13px; color:var(--gray-700); text-decoration:none; }
  .card{ background:var(--paper); border:1px solid var(--gray-300); border-radius:var(--radius); padding:20px 22px; margin-bottom:20px; }
  .card h2{ font-family:var(--font-display); font-size:16px; margin:0 0 14px; }
  #gate-msg{ text-align:center; padding:80px 20px; color:var(--gray-700); }
  #gate-msg a{ color:var(--red); }

  .btn-primary{ padding:10px 18px; border:none; border-radius:7px; background:var(--red); color:#fff; font-weight:600; font-size:13.5px; cursor:pointer; font-family:inherit; }
  .btn-primary:hover{ background:var(--red-dark); }
  .btn-ghost{ padding:10px 18px; border:1px solid var(--gray-300); border-radius:7px; background:none; color:var(--gray-700); font-weight:600; font-size:13.5px; cursor:pointer; font-family:inherit; }
  .btn-ghost:hover{ border-color:var(--red); color:var(--red); }

  .overlay{ position:fixed; inset:0; background:rgba(20,18,16,0.45); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .overlay.open{ display:flex; }
  .modal{ background:var(--paper); border-radius:var(--radius); padding:26px 26px 22px; width:100%; max-width:420px; box-shadow:0 24px 60px rgba(0,0,0,.25); }
  .modal h2{ font-family:var(--font-display); font-size:18px; margin:0 0 18px; }
  .modal .field{ margin-bottom:14px; }
  .modal .field label{ display:block; font-size:11px; font-weight:600; color:var(--gray-700); margin-bottom:5px; }
  .modal .field input, .modal .field select{ width:100%; padding:10px 11px; border:1px solid var(--gray-300); border-radius:7px; font-size:13.5px; font-family:inherit; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  .role-btns{ display:flex; gap:8px; }
  .role-btn{ flex:1; padding:9px 10px; border:1px solid var(--gray-300); border-radius:7px; background:none; color:var(--gray-700); font-weight:600; font-size:12.5px; cursor:pointer; font-family:inherit; transition:.15s; }
  .role-btn:hover{ border-color:var(--red); color:var(--red); }
  .role-btn.selected{ background:var(--red); border-color:var(--red); color:#fff; }
  .invite-msg{ font-size:12px; margin-top:4px; display:none; }
  .invite-msg.show{ display:block; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--gray-500); padding:8px 10px; border-bottom:1px solid var(--gray-300); }
  td{ padding:9px 10px; border-bottom:1px solid var(--gray-100); }
  .role-pill{ font-size:11px; font-weight:600; padding:2px 9px; border-radius:999px; background:var(--gray-100); color:var(--gray-700); }
  .role-pill.admin{ background:var(--red-tint); color:var(--red); }
  select.role-select{ font-size:12.5px; padding:5px 7px; border:1px solid var(--gray-300); border-radius:6px; font-family:inherit; }
  .status-pill{ font-size:11px; color:var(--gray-500); }
  .status-pill.active{ color:#1E8E5A; }
</style>
</head>
<body>

<header class="emn-header">
  <div class="emn-header__inner">
    <a href="https://zareenterprises.github.io/emn" class="emn-logo">
      <img src="/assets/img/emn-logo.png" alt="EMN logo">
    </a>
    <nav class="emn-nav">
      <a href="https://zareenterprises.github.io/emn" class="emn-nav__link">Home</a>
      <div class="emn-nav__item">
        <a href="https://zareenterprises.github.io/practice-lab" class="emn-nav__link">EMN Practice Lab</a>
        <button class="emn-nav__caret" aria-label="Abrir submenú de EMN Practice Lab" aria-expanded="false">&#9662;</button>
        <div class="emn-nav__dropdown">
          <a href="https://zareenterprises.github.io/sight-melody" class="emn-nav__dropdown-item">Berklee Sight Read</a>
          <a href="https://zareenterprises.github.io/interview-prep" class="emn-nav__dropdown-item">Berklee Interview Prep</a>
          <span class="emn-nav__dropdown-item is-disabled">Berklee Ear Training <span class="soon">Pronto</span></span>
          <span class="emn-nav__dropdown-item is-disabled">Berklee Piece &amp; Impro <span class="soon">Pronto</span></span>
        </div>
      </div>
      <a href="https://zareenterprises.github.io/feedback" class="emn-nav__link">Obtén Feedback</a>
      <a href="https://academy.emnlatam.com/" class="emn-nav__link emn-nav__link--external" target="_blank" rel="noopener">Nosotros</a>
    </nav>
  </div>
</header>

<div class="usuarios-wrap">
  <div class="usuarios-head">
    <h1>Usuarios</h1>
    <div style="display:flex;align-items:center;gap:14px">
      <button type="button" class="btn-primary" id="btn-open-add-user" style="display:none">Agregar Usuario</button>
      <a class="back" href="/practice-lab">&larr; Volver a Practice Lab</a>
    </div>
  </div>

  <div id="gate-msg" style="display:none"></div>

  <div id="usuarios-body" style="display:none">
    <div class="card">
      <h2>Personas</h2>
      <table>
        <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th></tr></thead>
        <tbody id="users-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add user modal -->
<div class="overlay" id="overlay-add-user">
  <div class="modal">
    <h2>Agregar usuario</h2>
    <div class="field"><label>Nombre</label><input type="text" id="inv-name" placeholder="Nombre completo"></div>
    <div class="field"><label>Correo</label><input type="email" id="inv-email" placeholder="correo@ejemplo.com"></div>
    <div class="field">
      <label>Rol</label>
      <div class="role-btns" id="inv-role-btns">
        <button type="button" class="role-btn selected" data-role="student">Estudiante</button>
        <button type="button" class="role-btn" data-role="professor">Profesor</button>
        <button type="button" class="role-btn" data-role="admin">Admin</button>
      </div>
    </div>
    <p class="invite-msg" id="invite-msg"></p>
    <div class="modal-actions">
      <button type="button" class="btn-ghost" id="btn-cancel-add-user">Cancelar</button>
      <button type="button" class="btn-primary" id="btn-invite">Agregar</button>
    </div>
  </div>
</div>

<script>
const ROLE_LABELS = { admin: 'Admin', professor: 'Profesor', student: 'Estudiante' };
let ALL_USERS = [];

async function loadUsers(){
  const { data } = await emnSupabase.from('students').select('*').order('created_at', { ascending: true });
  ALL_USERS = data || [];
}

function renderUsersTable(){
  const isAdmin = emnStudentProfile?.role === 'admin';
  document.getElementById('users-tbody').innerHTML = ALL_USERS.map(u => `
    <tr data-id="${u.id}">
      <td>${u.full_name || '—'}</td>
      <td>${u.email}</td>
      <td>${isAdmin
        ? `<select class="role-select" data-role-for="${u.id}">
             <option value="student" ${u.role==='student'?'selected':''}>Estudiante</option>
             <option value="professor" ${u.role==='professor'?'selected':''}>Profesor</option>
             <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
           </select>`
        : `<span class="role-pill ${u.role}">${ROLE_LABELS[u.role] || u.role}</span>`}</td>
      <td><span class="status-pill ${u.status}">${u.status === 'active' ? 'Activo' : 'Pendiente'}</span></td>
    </tr>
  `).join('') || '<tr><td colspan="4" style="color:var(--gray-500)">Nadie agregado todavía.</td></tr>';

  if(isAdmin){
    document.querySelectorAll('[data-role-for]').forEach(sel => {
      sel.addEventListener('change', async (e) => {
        const id = sel.dataset.roleFor;
        await emnSupabase.from('students').update({ role: e.target.value }).eq('id', id);
        const u = ALL_USERS.find(x => x.id === id);
        if(u) u.role = e.target.value;
      });
    });
  }
}

document.querySelectorAll('#inv-role-btns .role-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#inv-role-btns .role-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  });
});

document.getElementById('btn-open-add-user').addEventListener('click', () => {
  document.getElementById('inv-name').value = '';
  document.getElementById('inv-email').value = '';
  document.querySelectorAll('#inv-role-btns .role-btn').forEach(b => b.classList.toggle('selected', b.dataset.role === 'student'));
  document.getElementById('invite-msg').classList.remove('show');
  document.getElementById('overlay-add-user').classList.add('open');
});
document.getElementById('btn-cancel-add-user').addEventListener('click', () => {
  document.getElementById('overlay-add-user').classList.remove('open');
});
document.getElementById('overlay-add-user').addEventListener('click', (e) => {
  if(e.target.id === 'overlay-add-user') document.getElementById('overlay-add-user').classList.remove('open');
});

document.getElementById('btn-invite').addEventListener('click', async () => {
  const full_name = document.getElementById('inv-name').value.trim();
  const email = document.getElementById('inv-email').value.trim();
  const role = document.querySelector('#inv-role-btns .role-btn.selected')?.dataset.role || 'student';
  const msg = document.getElementById('invite-msg');
  msg.classList.remove('show');

  if(!email){ msg.textContent = 'El correo es obligatorio.'; msg.style.color = 'var(--red)'; msg.classList.add('show'); return; }
  if(!emnSession){ msg.textContent = 'Inicia sesión primero para poder agregar usuarios.'; msg.style.color = 'var(--red)'; msg.classList.add('show'); return; }

  const btn = document.getElementById('btn-invite');
  btn.disabled = true; btn.textContent = 'Agregando…';

  try {
    const res = await fetch(`${EMN_SUPABASE_URL}/functions/v1/invite-student`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${emnSession.access_token}`,
        'apikey': EMN_SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ email, full_name: full_name || null, role })
    });
    const result = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(result.error || 'No se pudo agregar.');

    await loadUsers();
    renderUsersTable();
    document.getElementById('overlay-add-user').classList.remove('open');
  } catch(err){
    msg.textContent = err.message;
    msg.style.color = 'var(--red)';
    msg.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = 'Agregar';
  }
});

async function boot(){
  await emnInit();

  // Free access: anyone can open this page and see the roster, logged in
  // or not. "Agregar Usuario" is Admin-only — the invite-student function
  // also checks this server-side, so this is belt-and-suspenders, not the
  // only thing stopping a non-Admin from inviting someone.
  document.getElementById('usuarios-body').style.display = 'block';
  if(emnStudentProfile?.role === 'admin') document.getElementById('btn-open-add-user').style.display = 'inline-block';

  await loadUsers();
  renderUsersTable();
}
boot();
</script>

</body>
</html>
